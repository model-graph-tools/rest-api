name: Release REST API

on:
  push:
    tags:
      - 'v*'

env:
  MVN: ./mvnw --show-version --batch-mode --no-transfer-progress

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: get-version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: REST API ${{ steps.get-version.outputs.version }}
          draft: false
          prerelease: false

  upload-amd64:
    name: Build and upload linux-amd64
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: graalvm
          cache: maven
      - run: $MVN -DskipTests package -Pnative
      - run: >
          cp
          target/model-graph-rest-api-${{ needs.create-release.outputs.version }}-runner
          target/${{ github.event.repository.name }}-${{ needs.create-release.outputs.version }}-linux-amd64
      - uses: softprops/action-gh-release@v2
        with:
          files: target/${{ github.event.repository.name }}-${{ needs.create-release.outputs.version }}-linux-amd64

  upload-arm64:
    name: Build and upload linux-arm64
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: graalvm
          cache: maven
      - run: |
          $MVN -DskipTests package -Pnative \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.container-runtime-options=--platform=linux/arm64
      - run: >
          cp
          target/model-graph-rest-api-${{ needs.create-release.outputs.version }}-runner
          target/${{ github.event.repository.name }}-${{ needs.create-release.outputs.version }}-linux-arm64
      - uses: softprops/action-gh-release@v2
        with:
          files: target/${{ github.event.repository.name }}-${{ needs.create-release.outputs.version }}-linux-arm64
