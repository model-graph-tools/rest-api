name: Release REST API

on:
  push:
    tags:
      - 'v*'

env:
  MVN: ./mvnw --show-version --batch-mode --no-transfer-progress

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get-version.outputs.version-without-v }}
    steps:
      - uses: actions/checkout@v5
      - id: get-version
        uses: battila7/get-version-action@v2.3.0
      - id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get-version.outputs.version }}
          release_name: REST API ${{ steps.get-version.outputs.version-without-v }}
          draft: false
          prerelease: false

  upload-amd64:
    name: Build and upload linux-amd64
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: graalvm
          cache: maven
      - run: $MVN -DskipTests package -Pnative
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/model-graph-rest-api-${{ needs.create-release.outputs.version }}-runner
          asset_name: ${{ github.event.repository.name }}-${{ needs.create-release.outputs.version }}-linux-amd64
          asset_content_type: application/octet-stream

  upload-arm64:
    name: Build and upload linux-arm64
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: graalvm
          cache: maven
      - run: |
          $MVN -DskipTests package -Pnative \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.container-runtime-options=--platform=linux/arm64
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/model-graph-rest-api-${{ needs.create-release.outputs.version }}-runner
          asset_name: ${{ github.event.repository.name }}-${{ needs.create-release.outputs.version }}-linux-arm64
          asset_content_type: application/octet-stream
