quarkus.banner.path=banner.txt

# Neo4j connection
quarkus.neo4j.uri=bolt://localhost:7687
quarkus.neo4j.authentication.disabled=true

# CORS (dev only — in production, nginx proxies same-origin)
%dev.quarkus.http.cors.origins=/.*/

# HTTP port
quarkus.http.port=8080

# Build info (resolved by Maven resource filtering at build time)
rest-api.build-time=@rest-api.build-time@
rest-api.commit=@rest-api.commit@
rest-api.tag=@rest-api.tag@

# OpenAPI
quarkus.smallrye-openapi.info-title=Model Graph REST API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=REST API for querying the WildFly management model graph
