# Neo4j connection
quarkus.neo4j.uri=bolt://localhost:7687
quarkus.neo4j.authentication.disabled=true

# CORS (allow halOP console on different port)
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/

# HTTP port
quarkus.http.port=8080

# OpenAPI
quarkus.smallrye-openapi.info-title=Model Graph REST API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=REST API for querying the WildFly management model graph
